name: Build Premium Desk

on:
  schedule:
    # GitHub cron is UTC. Three fixed weekday fires, chosen so each lands INSIDE ET
    # market hours in BOTH DST states (EDT market = UTC 13:30-20:00, EST market =
    # UTC 14:30-21:00; intersection UTC 14:30-20:00). No hour guard needed — the ET
    # clock time just shifts ~1h between summer/winter, which is fine for 3x/day.
    - cron: '35 14 * * 1-5'   # UTC 14:35  =  10:35 EDT / 9:35 EST   (morning)
    - cron: '5 17 * * 1-5'    # UTC 17:05  =  13:05 EDT / 12:05 EST  (midday)
    - cron: '35 19 * * 1-5'   # UTC 19:35  =  15:35 EDT / 14:35 EST  (late session)
  workflow_dispatch: {}   # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to build (weekdays only)
        id: guard
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          et = datetime.now(ZoneInfo("America/New_York"))
          manual = os.environ.get("EVENT") == "workflow_dispatch"
          # Build on ANY scheduled fire on a weekday (GitHub delays/drops scheduled crons, so
          # do NOT also gate on the hour — that was silently skipping every scheduled run).
          # The cron window (UTC 13-21) already keeps fires roughly within the trading day.
          run = manual or (et.weekday() < 5)
          print(f"ET={et.isoformat()}  weekday={et.weekday()}  manual={manual}  run={run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Install deps
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Build dashboard
        if: steps.guard.outputs.run == 'true'
        run: python build_site.py

      - name: Upload Pages artifact
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
