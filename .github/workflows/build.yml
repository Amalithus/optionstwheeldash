name: Build Premium Desk

on:
  schedule:
    # GitHub cron is UTC. Fire at :35 past every UTC hour that could fall inside
    # ET market hours year-round: EDT (UTC-4) covers UTC 13-20, EST (UTC-5) covers
    # UTC 14-21 -> union = UTC 13-21. The DST-aware guard below then lets only the
    # runs whose ET hour is 9..16 proceed, i.e. hourly ~9:35 through ~16:35 ET.
    - cron: '35 13-21 * * 1-5'
  workflow_dispatch: {}   # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to build (DST-aware, hourly during ET market hours)
        id: guard
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          et = datetime.now(ZoneInfo("America/New_York"))
          manual = os.environ.get("EVENT") == "workflow_dispatch"
          # Weekdays, hourly from ~9:35 ET (just after open) through ~16:35 ET (just after close)
          run = manual or (et.weekday() < 5 and 9 <= et.hour <= 16)
          print(f"ET={et.isoformat()}  weekday={et.weekday()}  manual={manual}  run={run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Install deps
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Build dashboard
        if: steps.guard.outputs.run == 'true'
        run: python build_site.py

      - name: Upload Pages artifact
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
